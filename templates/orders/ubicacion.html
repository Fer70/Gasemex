{% extends "base.html" %}

{% block title %}Dirección de entrega{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm mx-auto" style="max-width: 700px;">

        <div class="card-header bg-dark text-white">
            <h3 class="mb-0">Dirección de entrega</h3>
        </div>

        <div class="card-body">

            <p class="text-muted">
                Por el momento solo realizamos entregas en Ciudad de México,
                Estado de México y Morelos.
            </p>

            <form action="{{ url_for('orders.validar_ubicacion') }}"
                  method="POST">

                <div class="mb-3">
                    <label class="form-label">Estado</label>

                    <select name="estado"
                            class="form-select"
                            required>
                        <option value="">Selecciona un estado</option>
                        <option value="Ciudad de México">Ciudad de México</option>
                        <option value="Estado de México">Estado de México</option>
                        <option value="Morelos">Morelos</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Colonia</label>
                    <input type="text"
                           name="colonia"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Calle</label>
                    <input type="text"
                           name="calle"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Número</label>
                    <input type="text"
                           name="numero"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Código postal</label>
                    <input type="text"
                           name="cp"
                           class="form-control"
                           pattern="[0-9]{5}"
                           maxlength="5"
                           required>
                </div>
                {% if not puntos %}

                <button type="submit" class="btn btn-red btn-lg w-100 d-flex justify-content-center align-items-center">

                    <img src="{{ url_for('static', filename='uploads/mp.png') }}"
                     alt="Mercado Pago"
                    style="height:24px; margin-right:10px;">

                        Continuar al pago

                </button>
                {% else %}
                    <button type="submit" class="btn btn-red btn-lg w-100 d-flex justify-content-center align-items-center">

                        Pagar con puntos

                </button>
                {% endif %}

            </form>

        </div>

    </div>

</div>

{% endblock %}
