{% extends "base.html"  %}

{% block title %}Perfil{% endblock %}

{% block content %}
<div class="container mt-4">

    <div class="row mb-4">

        <div class="col">
            <h1 class="page-title">
                Perfil de {{ current_user.nombre_usuario }}
            </h1>

            <p class="text-muted">
                Administra tu información personal.
            </p>
        </div>
        <div class="col-md-4 text-end">

        <div class="logo-container">

            <img
            src="{{ url_for('static', filename='uploads/gas.png') }}"
            alt="Logo"
            class="dashboard-logo">

        </div>

    </div>

    </div>

    <div class="row g-4">

        <div class="col-md-6">
            <div class="card dashboard-card">
                <div class="card-body">
                    <h5>Información Personal</h5>
                    <hr>
                    <form method="POST" action="{{ url_for('profile.editar') }}">

                        <div class="mb-3">
                            <label class="form-label">Nombre de Usuario</label>
                            <input type="text" class="form-control" name="nombre_usuario" value="{{ current_user.nombre_usuario }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo electrónico para facturas</label>
                            <input type="email" class="form-control" name="email" value="{{ current_user.email }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono de contacto</label>
                            <input type="text" class="form-control" name="telefono" value="{{ current_user.telefono }}" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Actualizar Perfil</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
{% endblock %}
