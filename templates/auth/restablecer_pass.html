{% extends "base.html" %}

{% block title %}Nueva contraseña | GASEMEX{% endblock %}

{% block content %}

<div class="container py-5">

```
<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <div class="card shadow-sm border-0">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <h2 class="fw-bold">
                        Nueva contraseña
                    </h2>

                    <p class="text-muted mt-3">
                        Introduce una nueva contraseña para tu cuenta.
                    </p>

                </div>


                <form method="POST">

                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label fw-semibold">

                            Nueva contraseña

                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            minlength="8"
                            required
                            autocomplete="new-password"
                        >

                    </div>


                    <div class="mb-4">

                        <label
                            for="password_confirm"
                            class="form-label fw-semibold">

                            Confirmar contraseña

                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password_confirm"
                            name="password_confirm"
                            minlength="8"
                            required
                            autocomplete="new-password"
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-danger w-100">

                        Cambiar contraseña

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
```

</div>

{% endblock %}
